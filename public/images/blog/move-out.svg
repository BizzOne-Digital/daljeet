<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Move-out checklist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030A12"/>
      <stop offset="55%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#0077E6"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#19C8FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#19C8FF" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="fibres" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24 L24 0" stroke="#19C8FF" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#fibres)"/>
  <ellipse cx="420" cy="760" rx="520" ry="120" fill="url(#steam)"/>
  <path d="M180 820 C520 660, 860 900, 1180 720 S1500 560, 1600 680" fill="none" stroke="#19C8FF" stroke-opacity="0.25" stroke-width="4"/>
  <circle cx="260" cy="220" r="140" fill="#FFC400" fill-opacity="0.08"/>
  <text x="80" y="110" fill="#19C8FF" font-family="Arial, sans-serif" font-size="24" letter-spacing="6">LET'S GET CARPET CLEAN</text>
  <text x="80" y="360" fill="#F7FBFF" font-family="Arial Black, sans-serif" font-size="84">BLOG</text>
  <text x="82" y="430" fill="#E8EEF4" font-family="Arial, sans-serif" font-size="28">Move-out checklist</text>
  <text x="80" y="940" fill="#526273" font-family="Arial, sans-serif" font-size="22">Replace with client photography</text>
